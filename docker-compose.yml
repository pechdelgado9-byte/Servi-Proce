version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: serviproce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-serviproce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-serviproce_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-serviproce_cms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - serviproce_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-serviproce} -d ${POSTGRES_DB:-serviproce_cms}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  serviproce_pgdata:
    driver: local
